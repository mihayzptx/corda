        - generic [ref=f14e168]: Define the problem before scoping the solution
        - generic [ref=f14e169]: The scoping conversation is where most budget gets lost. We run structured diagnostic sessions before committing to anything. That investment pays back in every decision that follows.
      - generic [ref=f14e172]:
        - generic [ref=f14e173]: Senior engineers from day one, not after handoff
        - generic [ref=f14e174]: The people in your kickoff meeting are the people writing the code. No account manager in the middle, no team you meet at week six.
      - generic [ref=f14e177]:
        - generic [ref=f14e178]: Software that gets used, not just shipped
        - generic [ref=f14e179]: A deployed product nobody uses is not a success. We design for adoption from the first session — understanding who has to use the software and what makes them trust a new system.
      - generic [ref=f14e182]:
