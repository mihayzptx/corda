        - generic [ref=f14e219]: You need technical leadership, but a full-time CTO is premature.
        - generic [ref=f14e220]: The decisions you make in the next six months — stack choices, first hires, architecture — will accelerate or haunt the next three years. You need someone who has been through this before. That is what our Fractional CTO track is for.
