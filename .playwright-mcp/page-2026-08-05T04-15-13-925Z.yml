  - generic [ref=f14e142]:
    - generic [ref=f14e143]: Our approach
    - heading "We fix the problem, not just the symptoms." [level=1] [ref=f14e144]: We fix the problem,not just the symptoms.
    - paragraph [ref=f14e145]: Most software projects fail because the scoping conversation never happened properly. Requirements got assumed, the wrong problem got an expensive solution. We close that gap. Every engagement starts with structured diagnostic work before a line of code gets written.
