        - generic [ref=f10e102]: Infrastructure & Deployment
        - generic [ref=f10e103]: Deployed, not demoed. From day one.
        - paragraph [ref=f10e104]: We use managed infrastructure wherever it does not compromise the client's control or create problematic vendor dependency. Vercel and Railway for most web applications. AWS or GCP when compliance requirements, data residency, or scale demands more control. Docker and Terraform for anything that needs to be portable. CI/CD from the first day of the build — not added as an afterthought before handoff.
