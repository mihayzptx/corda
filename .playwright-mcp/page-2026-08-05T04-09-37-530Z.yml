        - generic [ref=f10e54]: Mobile
        - generic [ref=f10e55]: Cross-platform first. Native when the use case demands it.
        - paragraph [ref=f10e56]: React Native is the default for mobile work. It reduces build time, lets you share logic with your web codebase, and produces apps that perform well for the vast majority of use cases. We have shipped React Native applications to field technicians running Android devices in low-connectivity environments, to healthcare workers in clinical settings, and to consumer-facing products with 50K+ users.
        - paragraph [ref=f10e57]: We move to native Swift or Kotlin when the performance requirements, platform-specific integrations, or UX fidelity requirements genuinely justify the added complexity. That happens less often than most clients expect.
