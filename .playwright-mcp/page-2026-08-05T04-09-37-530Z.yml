  - generic [ref=f10e126]:
    - generic [ref=f10e127]: How we decide
    - generic [ref=f10e128]:
      - heading "What we build with. What we avoid and why." [level=2] [ref=f10e129]: What we build with.What we avoid and why.
      - paragraph [ref=f10e130]: The fastest way to understand our technology philosophy is to see the decisions we make and the reasoning behind them.
    - table [ref=f10e132]:
      - rowgroup [ref=f10e133]:
        - row [ref=f10e134]:
          - columnheader "Decision" [ref=f10e135]
          - columnheader "What we do" [ref=f10e136]
          - columnheader "What we avoid" [ref=f10e137]
          - columnheader "Why it matters for your business" [ref=f10e138]
      - rowgroup [ref=f10e139]:
        - row [ref=f10e140]:
          - cell "Architecture at early stage" [ref=f10e141]
          - cell "Well-structured monolith" [ref=f10e142]
          - cell "Microservices" [ref=f10e143]
          - cell "Microservices solve a scaling problem most early-stage products do not have yet. They add enormous operational overhead that slows shipping. You can always split a monolith; you cannot easily un-split a distributed system." [ref=f10e144]
        - row [ref=f10e145]:
          - cell "AI model selection" [ref=f10e146]
          - cell "GPT-4o or Claude 3.5 depending on task" [ref=f10e147]
          - cell "Fine-tuning as a first step" [ref=f10e148]
          - cell "Fine-tuning is expensive, slow, and often unnecessary. Prompt engineering and RAG solve 90% of what clients think they need fine-tuning for, in a fraction of the time and cost. We start with the simplest approach that works." [ref=f10e149]
        - row [ref=f10e150]:
          - cell "Database choice" [ref=f10e151]
          - cell "PostgreSQL as default" [ref=f10e152]
          - cell "NoSQL by default" [ref=f10e153]
          - cell "Postgres handles relational and document data, has excellent JSON support, and the ecosystem is deep. NoSQL databases are the right call for specific access patterns — not the default choice because it sounds more scalable." [ref=f10e154]
        - row [ref=f10e155]:
          - cell "Third-party integrations" [ref=f10e156]
          - cell "Official APIs, BAA-signed vendors" [ref=f10e157]
          - cell "Screen-scraping, unofficial APIs" [ref=f10e158]
          - cell "Unofficial integrations break without warning, expose you to terms-of-service violations, and create technical debt that is painful to unwind. We never build on a foundation that the provider can revoke." [ref=f10e159]
        - row [ref=f10e160]:
          - cell "AI output handling" [ref=f10e161]
          - cell "Explainable outputs with audit trails" [ref=f10e162]
          - cell "Black-box confidence scores" [ref=f10e163]
          - cell "Your team needs to understand why the AI produced a result in order to trust it. Trust is the adoption problem. Systems that show reasoning get used; systems that show a percentage score get ignored." [ref=f10e164]
        - row [ref=f10e165]:
          - cell "Frontend framework" [ref=f10e166]
          - cell "React / Next.js" [ref=f10e167]
          - cell "New framework per project" [ref=f10e168]
          - cell "Switching frontend frameworks per engagement creates knowledge silos and hiring difficulty. We standardize on React because it has the deepest talent pool, best tooling, and the best path to handing off a codebase your team can actually maintain." [ref=f10e169]
        - row [ref=f10e170]:
          - cell "CI/CD setup" [ref=f10e171]
          - cell "From day one of the build" [ref=f10e172]
          - cell "Added pre-handoff" [ref=f10e173]
          - cell "A CI/CD pipeline added at the end of a project is a CI/CD pipeline nobody trusts. We set it up before the first merge. By handoff day, it has been running for weeks and your team understands it." [ref=f10e174]
