      - generic [ref=f10e182]:
        - generic [ref=f10e185]:
          - generic [ref=f10e186]: Enterprise platform implementations
          - generic [ref=f10e187]: Salesforce customization, SAP modules, large ERP rollouts. These require dedicated specialists and long implementation timelines. We are not the right fit for this category and will tell you so immediately.
        - generic [ref=f10e190]:
          - generic [ref=f10e191]: Consumer social products and marketplaces
          - generic [ref=f10e192]: Two-sided marketplace dynamics and consumer social products need different expertise in growth, viral loops, and content moderation. We build business software and B2B products. That is what we are good at.
        - generic [ref=f10e195]:
          - generic [ref=f10e196]: Staff augmentation
          - generic [ref=f10e197]: We do not fill seats on existing teams as contractors. Our value is in the thinking that happens before the build. If you have a team and need bodies, we will recommend firms that do that well. We do not.
        - generic [ref=f10e200]:
          - generic [ref=f10e201]: Work where we cannot influence the approach
          - generic [ref=f10e202]: If the scope, stack, and architecture are fully defined before we arrive, we cannot add the value we are hired for. We need to be in the room when the foundational decisions get made.
