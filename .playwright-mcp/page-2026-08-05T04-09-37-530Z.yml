      - generic [ref=f10e114]:
        - generic [ref=f10e115]: Compliance-Sensitive Industries
        - generic [ref=f10e116]: HIPAA, SOC 2, and financial data — handled correctly from the start.
        - paragraph [ref=f10e117]: Retrofitting compliance is expensive. We design for it upfront. For healthcare clients, that means BAA-signed vendors, appropriate PHI handling, audit logging, and access controls built into the data model from the first migration. For financial services, that means segregated data environments, encryption at rest and in transit, and a documented approach to third-party data sharing that survives due diligence.
        - paragraph [ref=f10e118]: We have signed BAAs, completed vendor security questionnaires, and participated in technical due diligence processes across multiple engagements. We know what investors and auditors look for and we build toward those standards from the start.
