    - generic [ref=f10e34]: The decision framework
    - generic [ref=f10e35]:
      - heading "Three questions before every stack choice." [level=2] [ref=f10e36]: Three questions beforeevery stack choice.
      - paragraph [ref=f10e37]: "We ask the same three questions for every technology decision: Does it solve the problem? Can your team maintain it after we leave? Does it create a dependency that will hurt you in 18 months? Answers to those three questions eliminate 90% of the options."
    - generic [ref=f10e38]:
      - generic [ref=f10e39]:
        - generic [ref=f10e40]: Web Applications
        - generic [ref=f10e41]: The full-stack choices we use in production.
        - paragraph [ref=f10e42]: For most client web applications, the stack is React or Next.js on the frontend, Node.js or Python on the backend, and Postgres as the primary datastore. These are not glamorous choices. They are the choices that have the deepest talent pools, the most mature tooling, and the longest track records in production environments that look like yours.
        - paragraph [ref=f10e43]: We do not use a framework just because it was announced at a conference last quarter. We evaluate new tools constantly but add them to client projects only when they solve a specific problem that existing tools do not handle well.
