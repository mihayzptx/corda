    - generic [ref=f10e176]: Honest about limits
    - generic [ref=f10e177]:
      - generic [ref=f10e178]:
        - heading "What we do not build, and why we tell you." [level=2] [ref=f10e179]: What we do notbuild, and why we tell you.
        - paragraph [ref=f10e180]: There are categories of work we decline, not because we cannot technically do them, but because the client is better served by a different kind of partner. Knowing this before you contact us saves time for both of us.
