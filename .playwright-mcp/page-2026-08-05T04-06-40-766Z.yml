      - generic [ref=f6e18]: AI Integration
      - generic [ref=f6e19]: /
      - generic [ref=f6e20]: October 3, 2024
      - generic [ref=f6e21]: /
      - generic [ref=f6e22]: 7 min read
    - heading "You do not have an AI problem. You have a workflow problem." [level=1] [ref=f6e23]
    - paragraph [ref=f6e24]: Most companies investing in AI are doing it backwards. They find a model, then search for a use case. The companies that get real ROI start from the workflow and work backward to the technology.
  - generic [ref=f6e25]:
    - generic [ref=f6e26]:
      - heading "The pattern we keep seeing" [level=2] [ref=f6e27]
      - paragraph [ref=f6e28]: "A VP of Operations at a mid-size company reads three articles about AI productivity gains. He books a call with us. Within five minutes, the question is some version of: \"Where should we be using AI?\""
      - paragraph [ref=f6e29]: That question sounds reasonable. It is the wrong starting point. The companies that see measurable results from AI investments do not start there. They start with a specific, recurring, high-friction workflow and ask whether AI is the right tool for it. Sometimes it is. Often, something simpler fixes the problem faster and costs less to maintain.
      - paragraph [ref=f6e30]: The difference in approach sounds minor. The difference in outcomes is not.
      - heading "Why the backwards approach fails" [level=2] [ref=f6e31]
      - paragraph [ref=f6e32]: When you start with the technology and search for use cases, you end up evaluating AI by its novelty rather than its utility. You build things that are technically interesting but operationally marginal. The demo impresses people. Six months later, adoption is low because the system solved a problem the team did not actually feel.
      - paragraph [ref=f6e33]: We have seen this across every industry we work in. Healthcare systems that built AI to summarize clinical notes — a feature nobody asked for — while their intake process was still losing patients to 25-minute waits. Manufacturing companies that deployed predictive maintenance dashboards that nobody checked because the operators trusted their own ears more than a model score.
      - paragraph [ref=f6e34]: The technology was not wrong. The sequencing was.
      - paragraph [ref=f6e36]: The question is not "where can we use AI?" The question is "what takes the most time, creates the most errors, and happens the most often?" Answer that first.
      - heading "The workflow-first method" [level=2] [ref=f6e37]
      - paragraph [ref=f6e38]: Before we touch any technology in an AI engagement, we spend time mapping the actual workflow. Not the documented process — the real one. The one that involves three Slack channels, a shared spreadsheet that gets emailed around, and two people who are the unofficial single point of failure because everyone knows they are the fastest at a particular task.
      - paragraph [ref=f6e39]: "We look for four things:"
      - list [ref=f6e40]:
        - listitem [ref=f6e41]:
          - strong [ref=f6e42]: High frequency.
          - text: A task that happens hundreds of times a week has more leverage than one that happens monthly, even if the monthly task is more painful each time.
        - listitem [ref=f6e43]:
          - strong [ref=f6e44]: Structured input.
          - text: AI works best when the input is predictable. Unstructured, chaotic inputs produce unreliable outputs. If the workflow involves pulling information from 12 different formats, the pre-processing problem is often larger than the AI problem.
        - listitem [ref=f6e45]:
          - strong [ref=f6e46]: Measurable error cost.
          - text: If mistakes in this workflow have a real, quantifiable cost — rework time, customer impact, compliance exposure — you can build a business case. If the cost is vague, the ROI will be vague.
        - listitem [ref=f6e47]:
          - strong [ref=f6e48]: Human in the loop tolerance.
          - text: Some workflows benefit from AI making a recommendation that a human validates. Others need full automation. Knowing which you are building for changes the architecture significantly.
      - heading "What the mapping exercise produces" [level=2] [ref=f6e49]
      - paragraph [ref=f6e50]: A good workflow audit takes three to five business days. At the end, you have a ranked list of opportunities — not by what is technically interesting, but by expected impact per dollar of implementation cost. Most of the time, the highest-leverage opportunity is not the one the client came in expecting to build.
      - paragraph [ref=f6e51]: In one engagement, a logistics company came to us wanting to build an AI system to predict delivery delays. When we mapped their workflows, we found that 60% of their customer service volume was queries about order status — queries that could be fully automated with a simple integration that had nothing to do with predictive models. We built that first. It freed up enough customer service capacity to justify the more complex predictive work in a second phase.
      - paragraph [ref=f6e52]: The delay prediction system was technically more interesting. The status query automation paid for itself in 60 days.
      - heading "When AI is genuinely the right tool" [level=2] [ref=f6e53]
      - paragraph [ref=f6e54]: We are not AI skeptics. We build production AI systems. But we have earned the right to be specific about when AI adds real value versus when it adds complexity that a simpler system would not.
      - paragraph [ref=f6e55]: AI is the right tool when the input is variable and hard to fully enumerate in rules — when you cannot write the logic because the patterns are too numerous or subtle. It is the right tool when the scale of the task makes human review impractical. And it is the right tool when the cost of a wrong answer is acceptable with a human in the loop, because no AI system is right 100% of the time.
      - paragraph [ref=f6e56]: It is the wrong tool when the workflow has clear, enumerable rules that a deterministic system handles better. It is wrong when the input data is too inconsistent to produce reliable outputs. And it is wrong when adoption requires trust that the system has not yet earned.
      - heading "Starting the right conversation" [level=2] [ref=f6e57]
      - paragraph [ref=f6e58]: If you are evaluating AI investments, the most useful thing you can do before talking to any vendor is spend two hours with the people who do the highest-friction work in your operation. Ask them what takes the most time. Ask what they check twice because they know it is error-prone. Ask what they would automate first if they had the ability.
      - paragraph [ref=f6e59]: Their answers will be more useful than any vendor demo. And if you come to us with that list instead of a general question about where to use AI, the conversation will be sharper, faster, and more likely to produce something that actually gets used.
