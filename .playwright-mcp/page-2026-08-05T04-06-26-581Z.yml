        - generic [ref=f1e39]: 01 / AI Integration
        - heading "Turn AI from a talking point into a working system." [level=2] [ref=f1e40]
        - paragraph [ref=f1e41]: Most companies know AI should be part of their operation. Few know exactly where, or how to get there without wasting six months building something nobody uses. We map the highest-leverage opportunities in your specific workflow, then build systems that your team actually adopts. Every engagement ends with working, deployed software — not a prototype, not a slide deck, not a proof-of-concept that requires three more phases to become useful.
        - paragraph [ref=f1e42]: We work across LLM-based workflows, document processing, internal tools, customer-facing automation, and data pipelines. We are not tied to any vendor stack. We pick what fits the problem.
