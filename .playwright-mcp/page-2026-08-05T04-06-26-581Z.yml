        - generic [ref=f1e142]: 04 / Discovery & Strategy
        - heading "Clarity before commitment." [level=2] [ref=f1e143]
        - paragraph [ref=f1e144]: Before you spend serious money building something, you need to know you are building the right thing. Discovery is a fixed-price, time-boxed engagement — usually two to three weeks — that produces a written scope, a technical architecture plan, a build-vs-buy analysis, and a phased roadmap with real cost estimates. You can take those deliverables and build with us, or take them to any team you choose.
        - paragraph [ref=f1e145]: Most of our ongoing client relationships started here. It is the right way to begin, and we designed it so you leave with something useful regardless of what comes next.
