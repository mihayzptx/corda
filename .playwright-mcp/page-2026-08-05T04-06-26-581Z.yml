        - generic [ref=f1e108]: 03 / Fractional CTO
        - heading "Senior technical leadership without the full-time headcount." [level=2] [ref=f1e109]
        - paragraph [ref=f1e110]: "Early-stage companies often do not need a full-time CTO — they need someone who has been in the room before and can make the calls that matter: architecture decisions, the first technical hire, how to talk to investors about your stack, when to build vs. buy, how to run a vendor evaluation. We embed as that person on a monthly retainer."
        - paragraph [ref=f1e111]: This is a working role, not a consulting relationship. We attend your standups, review pull requests, run your engineering hiring process, and show up for investor meetings when the conversation turns technical.
