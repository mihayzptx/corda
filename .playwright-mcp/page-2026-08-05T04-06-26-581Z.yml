        - generic [ref=f1e73]: 02 / Embedded Engineer
        - heading "A senior engineer inside your team. From next month." [level=2] [ref=f1e74]
        - paragraph [ref=f1e75]: Recruiting a senior engineer takes three to six months on a good day. You post the role, screen candidates, run interviews, make an offer, wait out a notice period, and then spend another month onboarding before they are actually productive. Meanwhile the work is not getting done.
        - paragraph [ref=f1e76]: This track is the alternative. A CORDA engineer embeds directly into your existing team on a monthly retainer. They attend your standups, work in your codebase, review PRs alongside your people, and contribute to architecture decisions. They are functionally indistinguishable from a hire — without the recruiting timeline, the equity cost, or the long-term headcount commitment.
        - paragraph [ref=f1e77]: When the engagement ends, the knowledge stays with your team. We document what was built, hand off cleanly, and leave your engineers in a stronger position than before we arrived.
        - generic [ref=f1e78]:
