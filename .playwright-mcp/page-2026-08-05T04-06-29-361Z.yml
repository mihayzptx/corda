      - paragraph [ref=f2e84]: "Every industry has its own language, constraints, and political landscape. But the underlying software problems are familiar: bad data making its way into decisions, manual processes nobody has time to fix, and systems that do not talk to each other. We have seen enough of these to move fast when we encounter them."
      - paragraph [ref=f2e85]: The first thing we do in every engagement is spend real time understanding the domain before touching any code. That investment pays back in every decision that follows.
